name: Integration tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: Home Assistant contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.18'
          enable-cache: true
      - name: Install locked test environment
        run: uv sync --frozen
      - name: Lint maintained Python sources
        run: uv run --frozen ruff check custom_components tests scripts/package_release.py
      - name: Test real Home Assistant contracts and simulated capture transport
        run: uv run --frozen pytest
      - name: Verify deterministic private-data-free distribution
        run: python3 scripts/test_package_release.py
      - name: Validate reviewed release notes before publication
        run: python3 scripts/test_release_notes.py
