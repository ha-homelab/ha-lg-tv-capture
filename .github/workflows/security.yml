name: Security checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@07fd589df9d5dca5e92cfc7f1f5e0ba14e469be3 # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
