name: Integration tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: Home Assistant contracts
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.4'
          enable-cache: true
      - name: Install locked test environment
        run: uv sync --frozen
      - name: Lint maintained Python sources
        run: uv run --frozen ruff check custom_components tests fuzz scripts/package_release.py
      - name: Test real Home Assistant contracts and simulated capture transport
        run: uv run --frozen pytest
      - name: Replay synthetic fuzz regressions without mutation campaigns
        run: uv run --frozen python fuzz/replay.py
      - name: Verify deterministic private-data-free distribution
        run: python3 scripts/test_package_release.py
      - name: Validate reviewed release notes before publication
        run: python3 scripts/test_consumer_changelog.py
