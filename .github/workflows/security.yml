name: Security checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@5d28eb5407d1e9cbdef46ca8b8b65ea77c11db04 # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
