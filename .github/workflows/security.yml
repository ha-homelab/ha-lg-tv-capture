name: Security checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@b07180c5b397133fd8ba296181eb630fd603d468 # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
