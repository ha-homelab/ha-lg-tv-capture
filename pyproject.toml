[project]
name = "ha-lg-tv-capture"
version = "0.1.0"
description = "Private, on-demand LG webOS TV snapshots for Home Assistant"
requires-python = ">=3.14.2"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant==2026.11.0",
  "aiowebostv==0.10.0",
  "PyTurboJPEG==1.8.3",
  "ruff==0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# Let the Home Assistant plugin install its httpx alias before respx loads.
addopts = "-p no:respx --strict-markers --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.coverage.run]
source = ["custom_components.lg_tv_capture"]

[tool.coverage.report]
show_missing = true
