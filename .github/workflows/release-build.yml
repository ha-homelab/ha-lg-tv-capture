name: Package LG TV Capture
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      channel:
        type: string
        required: true
      release_plan_artifact:
        type: string
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: .
      - name: Apply frozen release version
        run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
      - name: Build and verify distribution
        run: |
          python3 scripts/test_package_release.py
          python3 scripts/package_release.py
      - name: Bind archive and checksums to the release plan
        run: python3 scripts/stage_release_assets.py --target integration --pattern 'release-dist/*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets-integration-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: release-assets/integration/*
          if-no-files-found: error
          retention-days: 30
