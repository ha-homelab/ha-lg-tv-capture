version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Update coupled fuzz workflow/runtime/policy pins together via the central toolkit.
    ignore:
      - dependency-name: "victron-venus/venus-os-ci-toolkit/.github/workflows/fuzz.yml"
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      testing:
        patterns: ['*']
